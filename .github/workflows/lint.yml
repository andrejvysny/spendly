name: linter

# Called by build.yml on pushes so the image is never published from a red commit,
# and run directly on pull requests so breakage surfaces before a merge.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main, develop]
  # No `push:` trigger on purpose. build.yml calls this workflow on pushes to
  # main/develop, and a reusable workflow evaluates github.workflow to the CALLER's
  # name — so a push-triggered copy would land in build.yml's own concurrency group
  # and cancel the build that is waiting on it. PRs run it directly; pushes run it
  # through build.yml.

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# Read-only: these jobs check, they no longer rewrite the tree.
permissions:
  contents: read

jobs:

  node_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # lint:check, not lint — `npm run lint` is `eslint --fix`, which "passes" by
      # silently rewriting files in the runner and reporting nothing.
      - name: Run ESLint
        run: npm run lint:check

      - name: Run Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run types

  php_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # --test reports violations and fails; bare `pint` would fix them in place
      # and always exit 0.
      - name: Run Pint
        run: vendor/bin/pint --test
