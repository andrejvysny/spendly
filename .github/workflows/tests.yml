name: tests

# Called by build.yml on pushes so the image is never published from a red commit,
# and run directly on pull requests so breakage surfaces before a merge.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main, develop]
  # No `push:` trigger on purpose. build.yml calls this workflow on pushes to
  # main/develop, and a reusable workflow evaluates github.workflow to the CALLER's
  # name — so a push-triggered copy would land in build.yml's own concurrency group
  # and cancel the build that is waiting on it. PRs run it directly; pushes run it
  # through build.yml.

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-artifacts
          path: public/build
          retention-days: 1

  node_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      # Jest runs against source, not the bundle, so no build step is needed here.
      - name: Run Tests
        run: npm run test

  php_tests:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-artifacts
          path: public/build

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          tools: composer:v2
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip, gd

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Create SQLite database for testing
        run: touch database/database.sqlite

      - name: Generate Application Key
        run: php artisan key:generate

      # Not needed by the suite (it migrates in-memory per test), but it catches a
      # migration that only breaks against a real file database.
      - name: Migration smoke check
        run: php artisan migrate --force
        env:
          DB_DATABASE: database/database.sqlite

      - name: Set up test environment
        run: |
          php artisan config:clear
          php artisan cache:clear
          php artisan view:clear
          php artisan route:clear

      # No DB_* overrides here. phpunit.xml already pins DB_DATABASE=":memory:", and a
      # step-level env var wins over phpunit's <env>, which is what pushed the suite onto
      # the shared file database and produced "database is locked". phpunit.xml is the
      # single source of truth and matches the `test` service in compose.yml.
      #
      # sample_data/ is gitignored, so the GoCardless fixture suites skip here by design
      # (GoCardlessFixtureLoader::fixturesAvailable()). Everything else runs.
      - name: Run Tests
        run: php artisan test -c phpunit.xml

  # The migration chain is developed against SQLite, which silently tolerates things
  # PostgreSQL rejects: dangling foreign keys, dropping a table other tables reference,
  # integer literals in boolean columns, select aliases in HAVING. Every one of those
  # shipped at some point and made a fresh pgsql install impossible. This job runs the
  # documented alternative database on every change so it cannot regress unnoticed.
  pgsql_migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spendly
          POSTGRES_PASSWORD: spendly
          POSTGRES_DB: spendly
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U spendly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          tools: composer:v2
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, bcmath, zip, gd

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate on PostgreSQL
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: spendly
          DB_USERNAME: spendly
          DB_PASSWORD: spendly

      - name: Re-run must be a no-op
        run: |
          out=$(php artisan migrate --force)
          echo "$out"
          echo "$out" | grep -q "Nothing to migrate" || { echo "::error::migrations are not idempotent"; exit 1; }
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: spendly
          DB_USERNAME: spendly
          DB_PASSWORD: spendly
