name: Security Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Run PHP Security Checker
        run: |
          composer require --dev roave/security-advisories
          composer audit

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-scan-results
          path: |
            composer.lock
            package-lock.json

  code-scanning:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript, php
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3

  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-secrets.sarif'
          scanners: 'secret'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: 'trivy-secrets.sarif'

  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # --target production is essential: without it Docker builds the LAST stage in
      # the file (`node`), so Trivy was scanning a throwaway node:alpine layer and the
      # FrankenPHP runtime that actually ships had never been scanned at all.
      - name: Build Docker image
        run: |
          docker build --target production -t spendly:security-test -f .docker/Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'spendly:security-test'
          format: 'sarif'
          output: 'trivy-docker.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: 'trivy-docker.sarif'

  financial-security-checks:
    name: Financial Data Security Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check for hardcoded financial data
        run: |
          echo "Checking for potential hardcoded financial data..."

          # Check for hardcoded credit card patterns
          if grep -r -E '\b[0-9]{4}[[:space:]-]?[0-9]{4}[[:space:]-]?[0-9]{4}[[:space:]-]?[0-9]{4}\b' --exclude-dir=node_modules --exclude-dir=vendor --exclude="*.md" .; then
            echo "⚠️  Potential credit card numbers found in code"
            exit 1
          fi

          # Check for hardcoded IBAN patterns.
          # Test fixtures legitimately need IBAN-shaped strings, so .github/iban-allowlist.txt
          # holds the reviewed synthetic ones. Anything not on that list fails the build,
          # which is what stops a real account number being committed again.
          allow=$(grep -vE '^\s*(#|$)' .github/iban-allowlist.txt)
          if grep -r -o -E '\b[A-Z]{2}[0-9]{2}[A-Z0-9]{4}[0-9]{7}([A-Z0-9]?){0,16}\b' \
               --exclude-dir=node_modules --exclude-dir=vendor --exclude-dir=.git \
               --exclude="*.md" --exclude=iban-allowlist.txt . \
             | awk -F: '{print $NF"\t"$0}' \
             | grep -vFf <(printf '%s\n' "$allow") ; then
            echo "⚠️  IBAN-shaped string found that is not in .github/iban-allowlist.txt"
            echo "    Use a synthetic SK99…/LT99… value, or add it to the allowlist if it is genuinely fake."
            exit 1
          fi

          # Check for hardcoded API keys (basic patterns)
          if grep -r -E '(api_key|apikey|secret_key|access_token|private_key)[[:space:]]*[=:][[:space:]]*["\']?[a-zA-Z0-9]{20,}' --exclude-dir=node_modules --exclude-dir=vendor --exclude="*.md" --exclude=".env.example" .; then
            echo "⚠️  Potential hardcoded API keys found"
            exit 1
          fi

          echo "✅ No obvious financial data patterns found in code"

      - name: Validate environment configuration
        run: |
          echo "Validating security-related environment configuration..."

          # Check if .env.example exists and has security-related variables
          if [ ! -f .env.example ]; then
            echo "⚠️  .env.example file missing"
            exit 1
          fi

          # Check that the security-relevant variables are at least documented.
          # DB_PASSWORD and GOCARDLESS_SECRET_KEY ship commented out (they are only
          # needed for non-sqlite installs and instance-wide bank sync respectively),
          # so accept a leading '# ' — the point is that a self-hoster can discover
          # them, not that they are set.
          required_vars=("APP_KEY" "DB_PASSWORD" "GOCARDLESS_SECRET_KEY")
          for var in "${required_vars[@]}"; do
            if ! grep -qE "^#? ?${var}=" .env.example; then
              echo "⚠️  Required security variable ${var} not documented in .env.example"
              exit 1
            fi
          done

          echo "✅ Environment configuration validation passed"

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --no-dev
          npm ci

      - name: Check PHP license compatibility
        run: |
          composer licenses --format=json > php-licenses.json
          echo "PHP license check completed"

      - name: Check Node.js license compatibility
        run: |
          npx license-checker --json > npm-licenses.json
          echo "Node.js license check completed"

      - name: Upload license reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: license-reports
          path: |
            php-licenses.json
            npm-licenses.json
