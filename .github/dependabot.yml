version: 2

# Weekly rather than daily: this is a single-maintainer project and a daily cadence
# turns into noise that gets ignored, which is worse than a slower cadence that gets read.
updates:
  - package-ecosystem: composer
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      php-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      js-minor-patch:
        update-types: [minor, patch]

  # Actions are pinned to SHAs, so without this they would never move at all.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci(deps)'

  - package-ecosystem: docker
    directory: '/.docker'
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: pip
    directory: '/ml'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
