services:
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-service
    environment:
      - DATABASE_URL=sqlite:////app/db/database.sqlite
      - ML_SERVICE_TOKEN=${ML_SERVICE_TOKEN:-dev-token}
      - LOG_LEVEL=DEBUG
    ports:
      - '8001:8001'
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ../database:/app/db:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
